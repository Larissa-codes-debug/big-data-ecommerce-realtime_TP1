services:

  # ============================================================
  # HADOOP / HDFS
  # ============================================================

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped

    environment:
      - CLUSTER_NAME=bigdata
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false

    ports:
      - "9870:9870"
      - "8020:8020"

    volumes:
      - namenode_data:/hadoop/dfs/name

    networks:
      - bigdata-net

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped

    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false

    depends_on:
      - namenode

    volumes:
      - datanode_data:/hadoop/dfs/data

    networks:
      - bigdata-net

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9864/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # GERADOR DE EVENTOS
  # ============================================================

  generator:
    build:
      context: ./src/generator
      dockerfile: Dockerfile

    container_name: ecommerce-generator
    hostname: generator
    restart: unless-stopped

    volumes:
      - logs_data:/var/log/myapp

    networks:
      - bigdata-net


  # ============================================================
  # FLUME
  # ============================================================

  flume:
    build:
      context: ./flume
      dockerfile: Dockerfile

    container_name: flume
    hostname: flume
    restart: unless-stopped

    depends_on:
      - namenode
      - datanode
      - generator

    volumes:
      - logs_data:/var/log/myapp
      - flume_state:/var/lib/flume
      - flink_input:/var/lib/flink-input

    networks:
      - bigdata-net


  # ============================================================
  # HBASE
  # ============================================================

  hbase:
    build:
      context: ./hbase
      dockerfile: Dockerfile

    container_name: hbase
    hostname: hbase
    restart: unless-stopped

    volumes:
      - hbase_data:/data/hbase

    ports:
      - "16010:16010"
      - "9090:9090"

    networks:
      - bigdata-net


  hbase-init:
    build:
      context: ./hbase
      dockerfile: Dockerfile

    container_name: hbase-init

    entrypoint:
      - /bin/bash
      - /init-hbase.sh

    volumes:
      - ./hbase/init-hbase.sh:/init-hbase.sh:ro

    depends_on:
      - hbase

    networks:
      - bigdata-net

    restart: "no"


  # ============================================================
  # FLINK
  # ============================================================

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    container_name: flink-jobmanager
    hostname: flink-jobmanager

    command: jobmanager

    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager

    ports:
      - "8081:8081"

    volumes:
      - flink_input:/var/lib/flink-input

    networks:
      - bigdata-net

    depends_on:
      - hbase-init


  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile

    container_name: flink-taskmanager
    hostname: flink-taskmanager

    command: taskmanager

    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - HBASE_HOST=hbase
      - HBASE_THRIFT_PORT=9090
      - HBASE_TABLE=ecommerce_metrics
      - FLINK_INPUT_DIR=/var/lib/flink-input

    depends_on:
      - flink-jobmanager
      - hbase-init

    volumes:
      - flink_input:/var/lib/flink-input

    networks:
      - bigdata-net


  flink-job:
    build:
      context: ./flink
      dockerfile: Dockerfile

    container_name: flink-job

    environment:
      - HBASE_HOST=hbase
      - HBASE_THRIFT_PORT=9090
      - HBASE_TABLE=ecommerce_metrics
      - FLINK_INPUT_DIR=/var/lib/flink-input

    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - hbase-init

    volumes:
      - flink_input:/var/lib/flink-input

    command: ["/opt/flink/job/submit_job.sh"]

    networks:
      - bigdata-net

    restart: "no"


  # ============================================================
  # POSTGRESQL DO HIVE METASTORE
  # ============================================================

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    hostname: hive-metastore-postgresql
    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - bigdata-net


  # ============================================================
  # HIVE METASTORE
  # ============================================================

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    hostname: hive-metastore
    restart: unless-stopped

    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive
      - SERVICE_PRECONDITION=namenode:9870 hive-metastore-postgresql:5432

    command: /opt/hive/bin/hive --service metastore

    ports:
      - "9083:9083"

    depends_on:
      - namenode
      - hive-metastore-postgresql

    networks:
      - bigdata-net


  # ============================================================
  # HIVE SERVER 2
  # ============================================================

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    hostname: hive-server
    restart: unless-stopped

    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql/metastore
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive
      - HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive
      - SERVICE_PRECONDITION=hive-metastore:9083

    ports:
      - "10000:10000"
      - "10002:10002"

    depends_on:
      - hive-metastore

    networks:
      - bigdata-net


  # ============================================================
  # SPARK
  # ============================================================

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile

    container_name: spark
    hostname: spark

    depends_on:
      - namenode
      - datanode
      - hive-metastore

    environment:
      SPARK_CONF_DIR: /opt/spark/conf
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/conf:/opt/spark/conf


    networks:
      - bigdata-net

# ==============================================================
# VOLUMES
# ==============================================================

volumes:
    namenode_data:
    datanode_data:
    logs_data:
    flume_state:
    flink_input:
    hbase_data:
    postgres_data:


# ==============================================================
# NETWORK
# ==============================================================

networks:
    bigdata-net:
      driver: bridge